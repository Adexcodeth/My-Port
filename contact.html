<body>
    <div class="nav">

            <li class="nav-logo"><a href="index.html">ALADEX</a></li>

            <li><button class="theme-toggle" type="button" data-theme-toggle>Light mode</button></li>
        </ul>
    </div>
    <main class="portfolio-section contact-section">
        <div class="section-label">LET'S CONNECT</div>
        <h2>Have a project in mind?<br><span>Let's make it happen.</span></h2>
        <form class="contact-form" data-contact-form action="https://formsubmit.co/aladexfawaz@gmail.com" method="POST">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <input type="hidden" name="_subject" value="New portfolio contact message">
            <input type="hidden" name="_captcha" value="false">
            <button type="submit">Send message</button>
            <button type="button" data-whatsapp-button>Send via WhatsApp</button>
            <p class="form-status" data-contact-status role="status"></p>
        </form>
        <div class="contact-info">
            <p>Email: aladexfawaz@gmail.com</p>
        </div>
         <div class="contact-info">
            <p>WhatsApp: <a href="https://wa.me/2347076028386" target="_blank" rel="noopener noreferrer">+234 707 602 8386</a></p>
        </div>
    </main>
    <footer>© 2026 Alade Fawaz. Designed with intention.</footer>
